name: Daily E-Commerce ETL Pipeline

on:
  #Run the workflow on a schedule (daily at midnight) and allow manual triggering
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  #Allow manual triggering of the workflow
  workflow_dispatch:

jobs:
  run_etl_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ETL Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FONNTE_TOKEN: ${{ secrets.FONNTE_API_KEY }}
          TARGET_PHONE_NUMBER: ${{ secrets.TARGET_PHONE_NUMBER }}
        run: |
          python main.py
